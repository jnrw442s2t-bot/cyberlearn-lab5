<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="style.css">
<script src="script.js" defer></script>
<meta name="description" content="Вхід на CyberLearn">
<title>Вхід — CyberLearn</title>
</head>
<body>
<main class="auth">
  <a class="logo" href="index.html">CyberLearn</a>
  <form novalidate data-api="/api/auth/login" data-next="index.html">
    <h1>Вхід</h1>
    <div class="field"><label for="email">Пошта</label><input id="email" name="email" type="email" data-rule="email" autocomplete="email"><p class="field-error" role="alert"></p></div>
    <div class="field"><label for="password">Пароль</label><input id="password" name="password" type="password" data-rule="loginPassword" autocomplete="current-password"><p class="field-error" role="alert"></p></div>
    <button class="btn" type="submit">Увійти</button>
    <p class="form-status" role="alert"></p>
    <p>Немає акаунта? <a href="register.html">Зареєструватися</a></p>
  </form>
</main>
</body>
</html>
