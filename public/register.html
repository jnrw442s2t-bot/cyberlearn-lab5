<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="style.css">
<script src="script.js" defer></script>
<meta name="description" content="Реєстрація на CyberLearn">
<title>Реєстрація — CyberLearn</title>
</head>
<body>
<main class="auth">
  <a class="logo" href="index.html">CyberLearn</a>
  <form novalidate data-api="/api/auth/register" data-next="login.html">
    <h1>Реєстрація</h1>
    <div class="field"><label for="name">Ім’я</label><input id="name" name="name" data-rule="name" autocomplete="name"><p class="field-error" role="alert"></p></div>
    <div class="field"><label for="email">Пошта</label><input id="email" name="email" type="email" data-rule="email" autocomplete="email"><p class="field-error" role="alert"></p></div>
    <div class="field"><label for="password">Пароль</label><input id="password" name="password" type="password" data-rule="password" autocomplete="new-password" aria-describedby="pwdHint"><small id="pwdHint" class="muted">Щонайменше 8 символів, латинські літери та цифри</small><p class="field-error" role="alert"></p></div>
    <div class="field"><label for="confirm">Підтвердження пароля</label><input id="confirm" name="confirm" type="password" data-rule="confirm" autocomplete="new-password"><p class="field-error" role="alert"></p></div>
    <button class="btn" type="submit">Створити акаунт</button>
    <p class="form-status" role="alert"></p>
    <p>Вже маєте акаунт? <a href="login.html">Увійти</a></p>
  </form>
</main>
</body>
</html>
